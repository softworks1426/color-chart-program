<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Color Chart Program</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
    }

    .start-screen, .top-bar {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 1em;
    }

    .start-screen {
      height: 100vh;
    }

    .top-bar {
      display: none;
    }

    h1, h1 a {
      margin-bottom: 0.5em;
      font-size: 1.5em; /* ← ここが修正ポイント */
      text-decoration: none;
      color: black;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-form {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5em;
    }

    .search-form input[type="text"] {
      padding: 0.5em;
      font-size: 16px;
      width: 260px;
      max-width: 80vw;
      box-sizing: border-box;
    }

    .search-form button {
      padding: 0.5em 1em;
      font-size: 16px;
    }

    .search-form input[type="range"] {
      width: 100px;
    }

    .loading-indicator {
      text-align: center;
      font-size: 14px;
      color: #888;
      padding: 1em;
      display: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 8px;
      padding: 10px;
    }

    .color-block {
      width: 100%;
      padding-bottom: 100%;
      border-radius: 0;
    }

    @media (max-width: 480px) {
      .search-form {
        flex-direction: column;
      }

      .search-form input,
      .search-form button,
      .search-form input[type="range"] {
        width: 100%;
      }

      h1 {
        font-size: 1.1em;
      }
    }
  </style>
</head>
<body>
  <div class="start-screen" id="start-screen">
    <h1><a href="/">Color Chart Program</a></h1>
    <form class="search-form" onsubmit="event.preventDefault(); startSearch();">
      <input type="text" id="query" placeholder="Search keyword..." />
      <button type="submit">Search</button>
    </form>
  </div>

  <div class="top-bar" id="top-bar">
    <h1><a href="/">Color Chart Program</a></h1>
    <form class="search-form" onsubmit="event.preventDefault(); startSearch();">
      <input type="text" id="query-top" placeholder="Search keyword..." />
      <button type="submit">Search</button>
      <input type="range" id="size-slider-top" min="40" max="200" value="80" title="サイズ調整" />
    </form>
  </div>

  <div class="loading-indicator" id="loading-indicator">Loading...</div>
  <div class="grid" id="color-grid"></div>

  <script>
    let offset = 1;
    let query = "";
    let loading = false;

    function startSearch(queryInput = null, pushState = true) {
      let input = "";
      const inputMain = document.getElementById("query");
      const inputTop = document.getElementById("query-top");

      if (queryInput !== null) {
        input = queryInput.trim();
      } else if (inputMain && inputMain.offsetParent !== null) {
        input = inputMain.value.trim();
      } else if (inputTop && inputTop.offsetParent !== null) {
        input = inputTop.value.trim();
      }

      if (!input) return;

      query = input;
      offset = 1;

      document.getElementById("start-screen").style.display = "none";
      document.getElementById("top-bar").style.display = "flex";
      document.getElementById("query-top").value = query;
      document.getElementById("color-grid").innerHTML = "";

      if (pushState) {
        history.pushState({ query }, '', `?q=${encodeURIComponent(query)}`);
      }

      loadMore();
    }

    async function loadMore() {
      if (loading || !query) return;
      loading = true;

      const loadingIndicator = document.getElementById("loading-indicator");
      loadingIndicator.style.display = "block";

      const res = await fetch(`/load?q=${encodeURIComponent(query)}&offset=${offset}`);
      const items = await res.json();
      const grid = document.getElementById("color-grid");

      if (items.length === 0) {
        loadingIndicator.textContent = "これ以上画像はありません";
        return;
      }

      items.forEach(item => {
        const a = document.createElement("a");
        a.href = item.link;
        a.target = "_blank";
        const div = document.createElement("div");
        div.className = "color-block";
        div.style.backgroundColor = item.color;
        a.appendChild(div);
        grid.appendChild(a);
      });

      offset += 1;
      loading = false;
      loadingIndicator.style.display = "none";
    }

    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) {
        loadMore();
      }
    }, { rootMargin: "200px" });

    const loadingTarget = document.createElement("div");
    document.body.appendChild(loadingTarget);
    observer.observe(loadingTarget);

    window.addEventListener("DOMContentLoaded", () => {
      const slider = document.getElementById("size-slider-top");
      const grid = document.getElementById("color-grid");
      if (slider) {
        slider.addEventListener("input", () => {
          const size = slider.value;
          grid.style.gridTemplateColumns = `repeat(auto-fill, minmax(${size}px, 1fr))`;
        });
        grid.style.gridTemplateColumns = `repeat(auto-fill, minmax(${slider.value}px, 1fr))`;
      }

      const params = new URLSearchParams(window.location.search);
      const q = params.get("q");
      if (q) {
        history.replaceState({ query: q }, '', window.location.href);
        startSearch(q, false);
      }
    });

    window.addEventListener("popstate", (event) => {
      const state = event.state;
      if (state && state.query) {
        startSearch(state.query, false);
      } else {
        document.getElementById("start-screen").style.display = "flex";
        document.getElementById("top-bar").style.display = "none";
        document.getElementById("color-grid").innerHTML = "";
        query = "";
        offset = 1;
      }
    });
  </script>
</body>
</html>
